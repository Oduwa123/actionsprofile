name: Build Job
on: 
  push:
    branches: 
      - main

  pull_request:
    branches: 
      - main

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if build Fails
        if: failure()
        run: echo "Build failed! Please check the logs for details."

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis for non-main branches."

  Security-Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with: 
          fetch-depth: 0

      - name: Run security scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          vunln-type: os,library
          output:  trivy-results.json

      - name: Upload Trivy filesystem scan
        uses: actions/upload-artifact@v5
        with:
          name: trivy-scan-results
          path: trivy-results.json


      - name: Notify if security scan fails
        if: failure()
        run: echo "Security scan failed! Please check the logs for details."

      